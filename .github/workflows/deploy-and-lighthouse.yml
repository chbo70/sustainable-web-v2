name: Deploy to GitHub Pages Subdirectory

on:
  push:
    branches:
      - "test/*"
      - "*" # Trigger for any branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set CI to false
        run: echo "CI=false" >> $GITHUB_ENV

      - name: Checkout branch
        uses: actions/checkout@v3

      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Clone gh-pages branch
        run: |
          git clone --depth 1 --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages

      - name: Remove existing subdirectory
        run: |
          cd gh-pages
          rm -rf "${{ github.ref_name }}"
          cd ..

      - name: Copy build output
        run: |
          mkdir -p gh-pages/${{ github.ref_name }}
          cp -r build/* gh-pages/${{ github.ref_name }}/

      - name: Commit and push
        run: |
          cd gh-pages
          git add .
          git commit -m "Deploy branch ${{ github.ref_name }} to GitHub Pages"
          git push origin gh-pages
